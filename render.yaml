services:
  - type: web
    name: coachline-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate --schema=prisma/schema.prisma && cd packages/shared && npx tsc && cd ../../apps/api && npx tsc
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coachline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: coachline-redis
          type: redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_SECRET
        generateValue: true
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET_NAME
        value: coachline-audio
      - key: WEB_URL
        sync: false

  - type: web
    name: coachline-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && cd apps/web && npx next build
    startCommand: cd apps/web && npx next start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_ENV
        value: production

  - type: redis
    name: coachline-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: coachline-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
