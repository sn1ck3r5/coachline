services:
  - type: web
    name: coachline-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate --schema=prisma/schema.prisma && cd apps/server && npx next build web
    startCommand: cd apps/server && npx tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coachline-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: AWS_REGION
        value: us-west-1
      - key: S3_BUCKET_NAME
        value: coachline-resources-722580582856-us-west-1-an
      - key: BEDROCK_REGION
        value: us-west-2
      - key: JWT_SECRET
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: BEDROCK_API_KEY
        sync: false

databases:
  - name: coachline-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
