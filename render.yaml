services:
  - type: web
    name: coachline-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate --schema=prisma/schema.prisma
    startCommand: npx tsx apps/api/src/server.ts
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coachline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: coachline-redis-2-2
          type: redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_SECRET
        generateValue: true
      - key: AWS_REGION
        value: us-west-1
      - key: S3_BUCKET_NAME
        value: coachline-resources-722580582856-us-west-1-an
      - key: WEB_URL
        value: https://coachline-web.onrender.com
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false

  - type: web
    name: coachline-worker
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate --schema=prisma/schema.prisma
    startCommand: npx tsx apps/worker/src/index.ts
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coachline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: coachline-redis-2-2
          type: redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3002"
      - key: AWS_REGION
        value: us-west-1
      - key: S3_BUCKET_NAME
        value: coachline-resources-722580582856-us-west-1-an
      - key: BEDROCK_REGION
        value: us-west-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false

  - type: web
    name: coachline-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && cd apps/web && npx next build
    startCommand: cd apps/web && npx next start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://coachline-api.onrender.com
      - key: NODE_ENV
        value: production

  - type: redis
    name: coachline-redis-2
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: coachline-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
